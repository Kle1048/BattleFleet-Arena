<!doctype html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>BattleFleet — Grafikvorschau</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#071827;color:#ecf6ff;font:14px system-ui}#app{position:fixed;inset:0}
aside{position:fixed;left:24px;top:24px;width:295px;padding:22px;background:#091c2eea;border:1px solid #7293aa55;border-radius:14px}
h1{font-size:23px;margin:0 0 12px}p{color:#b4cbdc;line-height:1.5}button,select{font:inherit;color:#eef6ff;background:#22445d;border:1px solid #64839b;border-radius:6px;padding:9px;margin:3px 2px;cursor:pointer}button:focus-visible,select:focus-visible{outline:2px solid #ffd391}
output{display:block;margin-top:14px;color:#abd8c5;font-size:12px}label{display:block;margin-top:14px}footer{position:fixed;bottom:18px;left:24px;background:#091c2edd;padding:10px 16px;border-radius:8px;color:#bad0de}
</style></head><body><div id="app"></div><aside><h1>Feuer, Rauch & Licht</h1><p>Ein Treffer am Schiff und ein Wassereinschlag daneben. Die Phasen lassen sich einzeln betrachten.</p>
<button id="play">Animation starten</button><button data-time="35">Blitz</button><button data-time="300">Feuer & Gischt</button><button data-time="1250">Rauch</button><button id="wake">Kielwasser</button>
<label>Perspektive <select id="angle"><option value="port">Nahansicht</option><option value="overhead">Draufsicht</option></select></label>
<label>Beleuchtung <select id="lighting"><option value="golden_hour">Abendsonne</option><option value="midday_clear">Mittag</option><option value="stormy_haze">Bewölkt</option></select></label>
<output id="stats">Lade Schiffsmodell …</output></aside><footer>Neue Effekte · maximal 960 Partikel · zwei Trefferlichter ohne Schatten</footer>
<script type="module" src="/src/benchmark/fxPreview.ts"></script></body></html>
